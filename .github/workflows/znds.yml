name: ZNDS 签到摸鱼

on:
  schedule:
    # 每 2 小时一次（cron 用 UTC，北京 = UTC+8）
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 不加 concurrency：允许同时运行多轮

jobs:
  daily:
    name: 签到 + 摸鱼
    runs-on: ubuntu-latest
    # 不设 timeout-minutes：走 GitHub 默认 360 分钟（单 job 硬上限 6 小时）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 签到一次 + 摸鱼循环
        env:
          ZNDS_COOKIE: ${{ secrets.ZNDS_COOKIE }}
          POLL_MS: "29000"
        run: node znds.js
