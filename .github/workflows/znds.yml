name: ZNDS 签到摸鱼

on:
  schedule:
    # UTC 时间；北京时间 = UTC+8。每 3 小时一次
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 不加 concurrency：万一重叠，两轮直接并行跑（不取消、不排队）

jobs:
  daily:
    name: 签到 + 摸鱼
    runs-on: ubuntu-latest
    # 必须小于触发间隔(180min)，否则任务重叠：新一轮只能在旧任务结束后才启动，
    # 表现出来就是「3 小时的 cron 变成了 6 小时一次」。留 10 分钟缓冲。
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 缓存 Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 签到一次 + 摸鱼循环
        env:
          ZNDS_COOKIE: ${{ secrets.ZNDS_COOKIE }}
          # 45 秒刷新一次，降低被站点限流的概率（发现 9 分钟的时机会晚 ~45s，仍在 10 分钟上限内）
          POLL_MS: "45000"
        run: node znds.js
