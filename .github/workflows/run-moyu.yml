name: ZNDS定时摸鱼-每3小时整点触发
on:
  workflow_dispatch:
  schedule:
    # 北京时间 0/3/6/9/12/15/18/21 整点，每3小时执行一次
    - cron: '0 */3 * * *'
      timezone: Asia/Shanghai

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ZNDS_COOKIE: ${{ secrets.ZNDS_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 读取Puppeteer浏览器缓存
        id: cache-znds
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-znds-puppeteer-cache-v2

      - name: 仅初次安装依赖，后续秒启动
        if: steps.cache-znds.outputs.cache-hit != 'true'
        run: npm install puppeteer

      - name: 执行摸鱼任务
        run: node moyu.js

      - name: 上传截图到GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: znds-screenshots
          path: screenshots/
          retention-days: 7
