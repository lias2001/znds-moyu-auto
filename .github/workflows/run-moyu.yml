name: ZNDS定时摸鱼-每日6轮整点触发
on:
  workflow_dispatch:
  schedule:
    # 北京时间 1/5/9/13/17/21 整点自动执行（GitHub Actions使用UTC时间，需减8小时）
    - cron: '0 17 * * *'  # 北京时间 1:00
    - cron: '0 21 * * *'  # 北京时间 5:00
    - cron: '0 1 * * *'   # 北京时间 9:00
    - cron: '0 5 * * *'   # 北京时间 13:00
    - cron: '0 9 * * *'   # 北京时间 17:00
    - cron: '0 13 * * *'  # 北京时间 21:00

permissions:
  actions: write
  contents: read
  pages: write       # 新增：用于上传截图
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ZNDS_COOKIE: ${{ secrets.ZNDS_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 读取Puppeteer浏览器缓存
        id: cache-znds
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-znds-puppeteer-cache-v2

      - name: 仅初次安装依赖，后续秒启动
        if: steps.cache-znds.outputs.cache-hit != 'true'
        run: npm install puppeteer

      - name: 执行摸鱼任务（每分钟一轮）
        run: node moyu.js

      - name: 上传截图到GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: znds-screenshots
          path: screenshots/
          retention-days: 7  # 截图保留7天
